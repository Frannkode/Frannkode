<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d">
  <title id="t">Franco, desarrollador full stack</title>
  <desc id="d">Un ticket de caja que se imprime con los servicios: tienda online, sistema de gestión, pedidos por WhatsApp y web. Lleva un sello que dice disponible.</desc>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .print { animation: print 2.2s cubic-bezier(.2,.7,.2,1) .3s 1 both; }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp .28s cubic-bezier(.3,1.4,.5,1) 2.7s 1 both; }
    @keyframes print { from { transform: translateY(-320px); } to { transform: translateY(0); } }
    @keyframes stamp { from { opacity: 0; transform: scale(1.7); } to { opacity: .92; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .print, .stamp { animation: none; } }
  </style>
  <defs>
    <clipPath id="out"><rect x="0" y="34" width="900" height="326"/></clipPath>
  </defs>

